<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أسطورة الضفدع النينجا</title>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#2a2540;--ink:#f6f0e4;--gold:#ffd24a;--panel:rgba(18,15,32,.9);--line:#5b5380;--red:#ff5a5f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0b16;--panel:rgba(8,7,16,.92);--line:#3d3760}}
:root[data-theme="dark"]{--bg:#0d0b16;--panel:rgba(8,7,16,.92);--line:#3d3760}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Reem Kufi',Tahoma,sans-serif;display:grid;place-items:center;overflow:hidden;touch-action:none;user-select:none}
#wrap{position:relative;width:min(100vw,calc(100vh*1.7647));width:min(100vw,calc(100dvh*1.7647));aspect-ratio:960/544;box-shadow:0 0 0 3px var(--line)}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
#hud{position:absolute;inset:0 0 auto 0;display:flex;justify-content:space-between;gap:1em;padding:1.2% 2%;font-weight:700;font-size:clamp(11px,2.3vw,24px);text-shadow:0 2px 0 #000,0 0 6px #000;pointer-events:none}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:.6em;background:var(--panel);text-align:center;padding:4%;overflow:auto;-webkit-touch-callout:none}
#ov.off{display:none}
h1{margin:0;font-size:clamp(22px,5.6vw,58px);color:var(--gold);text-shadow:0 4px 0 #000;line-height:1.15}
#ov p{margin:0;font-size:clamp(12px,2.2vw,22px);max-width:34em;line-height:1.7}
.keys{color:#cfc7e8;font-size:clamp(11px,1.8vw,18px)!important}
button{font:700 clamp(15px,2.8vw,28px) 'Reem Kufi',Tahoma,sans-serif;background:var(--gold);color:#1b1530;border:0;border-radius:6px;padding:.4em 1.6em;margin-top:.5em;cursor:pointer;box-shadow:0 5px 0 #a8801a}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #a8801a}
#hp{display:flex;gap:.5em;flex-wrap:wrap;justify-content:center;margin:.2em 0}
#hp button{font-size:clamp(10px,1.7vw,16px);background:rgba(255,255,255,.08);color:var(--ink);padding:.35em .6em;margin:0;box-shadow:none;border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:.1em;min-width:5.6em}
#hp button.on{border-color:var(--gold);background:rgba(255,210,74,.2)}
#hp small{font-weight:500;color:#cfc7e8}
#hp canvas{width:clamp(36px,7vw,60px);image-rendering:pixelated}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
#pad{display:none;position:absolute;inset:auto 0 4% 0;justify-content:space-between;align-items:flex-end;padding:0 calc(3% + env(safe-area-inset-left,0px)) 0 calc(3% + env(safe-area-inset-right,0px));direction:ltr;pointer-events:none}
#pad>div{display:flex;gap:12px;pointer-events:auto}
#pad b{width:clamp(56px,12vw,96px);aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.5);display:grid;place-items:center;font-size:clamp(18px,3.6vw,34px);color:#fff;touch-action:none}
#pad>#dp{gap:0;border-radius:999px;background:rgba(255,255,255,.1)}
#dp b{width:clamp(64px,14vw,110px);background:transparent;border-color:transparent}
#pad b.d{background:rgba(255,210,74,.55);border-color:var(--gold)}
#tb{display:none;position:absolute;top:9%;left:2%;gap:8px;direction:ltr}
#tb b{width:clamp(34px,6vw,48px);aspect-ratio:1;border-radius:50%;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.5);display:grid;place-items:center;font-size:clamp(14px,2.6vw,22px);color:#fff}
#rot{display:none;position:fixed;inset:0;z-index:9;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:.4em;text-align:center;font-size:6vw;font-weight:700}
.tcp{display:none}
@media (pointer:coarse){#pad,#tb{display:flex}.kbp{display:none!important}.tcp{display:block!important}}
@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
@media (max-height:430px){#hp canvas{width:28px}h1{font-size:8vh}#ov p{font-size:4vh}#ov{gap:.3em}}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="960" height="544"></canvas>
<div id="hud"></div>
<div id="tb"><b id="pz">⏸</b><b id="fs">⛶</b></div>
<div id="pad"><div id="dp"><b>◀</b><b>▶</b></div><div><b class="a" data-k="ShiftLeft">⚡</b><b class="a" data-k="Space">▲</b></div></div>
<div id="ov"><h1>جارِ التحميل…</h1></div>
</div>
<div id="rot"><span>🔄</span><span>أدِر الهاتف أفقيًا للّعب</span></div>

  for(const f of fx){f.t+=f.k==='p'?-dt:dt;if(f.k==='p'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=300*dt}}
  fx=fx.filter(f=>f.k==='p'?f.t>0:f.t<.35);if(shake>0)shake-=dt;
  const tg=Math.max(0,Math.min(LV.W*T-VW,P.x+6-VW/2+P.face*28));cam+=(tg-cam)*Math.min(1,dt*6)}
 if(LV)draw()}
addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
 if(!e.repeat){keys[e.code]=true;press[e.code]=true;
  if((e.code==='Enter'||e.code==='Space')&&action)run();
  if(e.code==='KeyR'&&mode==='play'){S.lives=Math.max(1,S.lives);startLevel(S.lv)}
  if(e.code==='KeyP'||e.code==='Escape')togglePause();}});
addEventListener('keyup',e=>{keys[e.code]=false});
document.querySelectorAll('#pad .a').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true;press[k]=true;b.classList.add('d');if(action)run()});['pointerup','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{keys[k]=false;b.classList.remove('d')}))});
const dp=document.getElementById('dp');let dpOn=false;
const dpSet=e=>{const r=dp.getBoundingClientRect(),l=e.clientX-r.left<r.width/2;keys.ArrowLeft=l;keys.ArrowRight=!l;dp.children[0].classList.toggle('d',l);dp.children[1].classList.toggle('d',!l)};
dp.addEventListener('pointerdown',e=>{e.preventDefault();dp.setPointerCapture(e.pointerId);dpOn=true;dpSet(e);if(action)run()});
dp.addEventListener('pointermove',e=>{if(dpOn)dpSet(e)});
['pointerup','pointercancel'].forEach(ev=>dp.addEventListener(ev,()=>{dpOn=false;keys.ArrowLeft=keys.ArrowRight=false;[...dp.children].forEach(c=>c.classList.remove('d'))}));
function togglePause(){if(mode!=='play')return;paused=!paused;if(paused){ov.innerHTML='<h1>إيقاف مؤقت</h1><p>اضغط على الشاشة للمتابعة</p>';ov.classList.remove('off')}else ov.classList.add('off')}
document.getElementById('pz').addEventListener('pointerdown',e=>{e.preventDefault();togglePause()});
document.getElementById('fs').addEventListener('pointerdown',e=>{e.preventDefault();try{const d=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else d.requestFullscreen().then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})).catch(()=>{})}catch(x){}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play'&&!paused)togglePause()});
try{matchMedia('(orientation:portrait) and (pointer:coarse)').addEventListener('change',e=>{if(e.matches&&mode==='play'&&!paused)togglePause()})}catch(e){}
addEventListener('contextmenu',e=>e.preventDefault());
ov.addEventListener('pointerdown',()=>{if(paused)togglePause()});

Promise.all(Object.entries(A).map(([k,v])=>new Promise(r=>{const i=new Image();i.onload=r;i.onerror=r;i.src=v;IM[k]=i}))).then(()=>{
 S={lv:0,lives:5,score:0,fruits:0,time:0};LV=gen(0);LV.total=LV.E.fruits.length;spawn={x:3*T,y:G*T-16};P=mk();cam=0;
 show('أسطورة الضفدع النينجا','خمس مراحل. خمس أرواح. بلا رحمة.<br>الفخاخ تتضاعف مع كل مرحلة، ولا شيء يساعدك سوى مهارتك.<br>أفضل نتيجة: '+best,'ابدأ التحدي',()=>newGame(0),true);
 ov.insertAdjacentHTML('beforeend','<p class="keys tcp">على الهاتف: اضغط ◀ ▶ للتحرك (اسحب بينهما للتبديل) · ▲ للقفز، واضغطه مرة ثانية في الهواء للقفزة المزدوجة · ⚡ للاندفاع<br>🍒 درع · 🍈 تجميد الأعداء · 🍍 روح إضافية</p><p class="keys kbp">الحركة: ← → أو A D · القفز: مسافة أو ↑ (اضغط مرتين للقفزة المزدوجة)<br>الالتصاق بالجدار ثم القفز: اضغط نحو الجدار · الاندفاع: Shift أو K · إعادة: R · إيقاف: P<br>🍒 درع يحميك من ضربة · 🍈 يجمّد الأعداء ٥ ثوانٍ · 🍍 روح إضافية<br>ألسنة اللهب تشتعل بالتناوب · منصّات تتحرك وأخرى تسقط</p>');
 requestAnimationFrame(loop)});
</script>
